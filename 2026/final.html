<div class="longread final-copy"><p>赵宁后来补了一件小事，这些年父亲来接她、送她，都只到旧站外面的雨棚，车到了，他帮她把箱子搬下来，车要走，他就站在那里，看她自己进站</p><p>她以前一直觉得父亲只是嫌大厅里人多</p><p>看过附页以后，她停了一会儿，说：“这个我现在也没法问了，所以就这样吧”</p></div>
<p class="final-fact">榆桥客运站旧站于2026年9月30日停止使用</p></main><footer class="site-footer">榆川人 · 城市记忆　© 2026 榆川地方网页保存计划</footer></div></body></html>
